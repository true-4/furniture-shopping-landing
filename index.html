<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/index.css">
  <title>Beautiful house</title>
  <link rel="icon" href="img/icon/icon-head.png">
</head>
<body>
  <header class="wrapper">
    <div class="header-contacts">
      <div class="contacts">
        <div class="address">
          <img src="img/img_header/icons/location.svg" alt="Address-icon" class="icon">
          <p>ул. Дзержинского 50 а (офис продаж)</p>
        </div>
        <div class="contact">
          <div class="telephone">
            <img src="img/img_header/icons/phone.svg" alt="Phone-icon" class="icon">
            <a href="tel:+79533200080">8 (953) 320-00-80</a>
          </div>
          <div class="telephone">
            <img src="img/img_header/icons/phone.svg" alt="Phone-icon" class="icon">
            <a href="tel:+79533200080">8 (953) 320-00-80</a>
          </div>
          <p class="work-time">Будние с 9:00 до 20:00</p>
        </div>
        <div class="networks arrange">
          <p>Мы в соцсетях</p>
          <ul class="social">
            <li>
              <a href="#">
                <img src="img/img_header/icons/social_vk.svg" alt="ВКонтакте">
              </a>
            </li>
            <li>
              <a href="#">
                <img src="img/img_header/icons/social_youtube.svg" alt="Ютюб">
              </a>
            </li>
            <li>
              <a href="#">
                <img src="img/img_header/icons/social_telegram.svg" alt="Телеграм">
              </a>
            </li>
            <li>
              <a href="#">
                <img src="img/img_header/icons/social_dzen.svg" alt="Дэен">
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="global-nav">
      <div class="logo">
        <h1 class="brand-text">Красивый дом</h1>
        <a href="#">
          <img src="img/img_header/icons/Logo.svg" alt="Brand">
        </a>
        <p class="slogan">Дизайн для вашего интерьера</p>
      </div>
      <div class="nav-list">
        <nav>
          <ul class="list">
            <li class="items first">
              <img src="img/img_header/icons/menu-icon.svg" alt="Иконка меню">
              <a href="#">Каталог</a>
            </li>
            <li class="items">
              <a href="#">Преимущества</a>
            </li>
            <li class="items">
              <a href="#">Доставка и оплата</a>
            </li>
            <li class="items">
              <a href="#">О компании</a>
            </li>
            <li class="items">
              <a href="#">Контакты</a>
            </li>
          </ul>
        </nav>
        <div class="buttons">
          <button class="lang-btn general-btn">Ru</button>
          <button class="order-btn general-btn">Оставить заявку</button>
        </div>
      </div>
    </div>
  </header>
</body>
</html>
