<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/index.css">
  <title>Beautiful house</title>
  <link rel="icon" href="img/icon/icon-head.png">
</head>
<body>
  <div class="local-wrapper">
    <header class="general-header">
      <div class="general-header--header-contacts">
        <div class="contacts">
          <div class="contacts--address">
            <img src="img/icon/location.svg" alt="Локация">
            <a class="space" href="#">ул. Дзержинского 50 а (офис продаж)</a>
          </div>
          <div class="contacts--contact-phone">
            <div class="phone-number">
              <img src="img/icon/phone.svg" alt="Телефон">
              <a class="space" href="tel:+79533200080">8 (953) 320-00-80</a>
            </div>
            <div class="phone-number">
              <img src="img/icon/phone.svg" alt="Телефон">
              <a class="space" href="tel:+79533200080">8 (953) 320-00-80</a>
            </div>
            <p class="work-time">Будние с 9:00 до 20:00</p>
          </div>
          <div class="contacts-social-networks">
            <p class="text-social-networks">Мы в соцсетях</p>
            <div class="button-box-social-networks">
              <button class="image-button-vk"></button>
              <button class="image-button-youtube"></button>
              <button class="image-button-telegram"></button>
              <button class="image-button-dzen"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="general-header--header-router">
        <div class="brand">
          <img src="img/icon/LogoSymbol.svg" alt="Логотип бренда">
          <img src="img/icon/Line 1.svg" alt="Вертикальная декоративная линия">
          <p class="slogan">Дизайн для вашего интерьера</p>
        </div>
        <div class="actions">
          <nav class="navigation-list">
            <ul class="navigation-list--menu flex-first-element">
              <li class="flex-first-element padding">
                <img src="img/icon/IconLeft.svg" alt="">
                <a href="#">Каталог</a>
              </li>
              <li class="padding">
                <a href="#">Преимущества</a>
              </li>
              <li class="padding">
                <a href="#">Доставка и оплата</a>
              </li>
              <li class="padding">
                <a href="#">О компании</a>
              </li>
              <li class="padding">
                <a href="#">Контакты</a>
              </li>
            </ul>
          </nav>
          <div class="navigation-list--get-order-btn">
            <button class="choose-lang">Ru</button>
            <button class="request">Оставить заявку</button>
          </div>
        </div>
      </div>
    </header>
  </div>
</body>
</html>
